name: LWT Supabase keep-active

on:
  workflow_dispatch:
    inputs:
      run_inventory:
        description: "Also run the weekly LWT inventory intelligence job"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 13 * * 1,3,5"
    - cron: "37 13 * * 1"

permissions:
  contents: read

jobs:
  supabase-heartbeat:
    name: Supabase heartbeat
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 13 * * 1,3,5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LWT_DATABASE_URL: ${{ secrets.LWT_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run safe database heartbeat
        shell: bash
        run: |
          if [ -z "${LWT_DATABASE_URL:-}" ]; then
            echo "LWT_DATABASE_URL GitHub secret is required"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import pg from "pg";

          const pool = new pg.Pool({ connectionString: process.env.LWT_DATABASE_URL });
          try {
            await pool.query("select 1");
            console.log("Supabase heartbeat OK");
          } finally {
            await pool.end();
          }
          NODE

  weekly-inventory:
    name: Weekly inventory intelligence
    if: ${{ github.event.schedule == '37 13 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.run_inventory == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.LWT_DATABASE_URL }}
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_API_VERSION: "2026-01"
      CONTENT_TOPICS_PATH: config/content_topics.json
      SHOPPER_BEHAVIOR_IMPORT_DIR: imports/shopper-behavior
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run inventory intelligence
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "LWT_DATABASE_URL GitHub secret is required"
            exit 1
          fi

          npm run intelligence:inventory
